# Mise en ligne du portfolio sur GitHub Pages.
# Le site est 100 % statique : `astro build` produit dist/, Pages le sert tel quel.
#
# ⚠ SITE_URL doit etre l'URL PUBLIQUE reelle : Astro s'en sert pour le sitemap et
#   les balises canoniques. Laissee au placeholder, le sitemap annonce un domaine
#   qui n'existe pas — erreur invisible en local, visible seulement une fois en ligne.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Le jeton n'a que ce qu'il faut pour publier, rien de plus.
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul deploiement a la fois ; on ne coupe pas celui qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        env:
          SITE_URL: https://yuno15-bb.github.io
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
